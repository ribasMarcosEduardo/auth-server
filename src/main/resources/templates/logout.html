<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sair | ONG Adoção</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background: radial-gradient(circle at top, #ecfdf5 0%, #f1f5f9 55%, #e2e8f0 100%);
            color: #1e293b;
            min-height: 100vh;
        }
        .oidc-card {
            max-width: 440px;
            width: 100%;
            border: 1px solid #e2e8f0;
            border-radius: 1.25rem;
            box-shadow: 0 20px 35px -12px rgba(15, 23, 42, 0.1);
            overflow: hidden;
        }
        .oidc-header {
            background: linear-gradient(135deg, #065f46 0%, #059669 65%, #10b981 100%);
            color: #ffffff;
            padding: 1.75rem 1.5rem;
            text-align: center;
        }
        .brand-badge {
            width: 52px;
            height: 52px;
            border-radius: 0.9rem;
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(6px);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 0.75rem;
        }
        .form-label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #334155;
        }
        .form-control {
            border-radius: 0.65rem;
            border-color: #cbd5e1;
            padding: 0.625rem 0.875rem;
            font-size: 0.95rem;
        }
        .form-control:focus {
            border-color: #10b981;
            box-shadow: 0 0 0 0.2rem rgba(16, 185, 129, 0.18);
        }
        .consent-box {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 0.85rem;
            padding: 0.85rem 1rem;
        }
        .form-check-input:checked {
            background-color: #059669;
            border-color: #059669;
        }
        .btn-emerald {
            background-color: #059669;
            border-color: #059669;
            color: #ffffff;
            font-weight: 600;
            border-radius: 0.7rem;
            padding: 0.7rem 1rem;
            transition: background-color 0.15s ease, transform 0.1s ease;
        }
        .btn-emerald:hover {
            background-color: #047857;
            border-color: #047857;
            color: #ffffff;
        }
        .btn-emerald:active {
            transform: scale(0.99);
        }
    </style>
</head>
<body onload="document.getElementById('f').submit()" class="d-flex align-items-center justify-content-center p-3">

<div class="card oidc-card bg-white">
    <div class="oidc-header">
        <div class="brand-badge">
            <i class="bi bi-shield-lock-fill"></i>
        </div>
        <h5 class="fw-bold mb-1">Encerrar sessão</h5>
        <p class="small mb-0 opacity-90">Encerrando sua sessão no provedor</p>
    </div>

    <div class="card-body p-4 p-md-4 text-center">
        <form id="f" th:action="@{/logout}" method="post">
            <input type="hidden" name="post_logout_redirect_uri" th:if="${postLogoutRedirectUri}" th:value="${postLogoutRedirectUri}">
            <p class="small text-secondary">Encerrando a sessão no servidor de autorização…</p>
            <button type="submit" class="btn btn-emerald w-100">Sair</button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
