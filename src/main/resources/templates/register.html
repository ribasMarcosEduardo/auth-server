<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta | ONG Adoção</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background: radial-gradient(circle at top, #ecfdf5 0%, #f1f5f9 55%, #e2e8f0 100%);
            color: #1e293b;
            min-height: 100vh;
        }
        .oidc-card {
            max-width: 440px;
            width: 100%;
            border: 1px solid #e2e8f0;
            border-radius: 1.25rem;
            box-shadow: 0 20px 35px -12px rgba(15, 23, 42, 0.1);
            overflow: hidden;
        }
        .oidc-header {
            background: linear-gradient(135deg, #065f46 0%, #059669 65%, #10b981 100%);
            color: #ffffff;
            padding: 1.75rem 1.5rem;
            text-align: center;
        }
        .brand-badge {
            width: 52px;
            height: 52px;
            border-radius: 0.9rem;
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(6px);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 0.75rem;
        }
        .form-label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #334155;
        }
        .form-control {
            border-radius: 0.65rem;
            border-color: #cbd5e1;
            padding: 0.625rem 0.875rem;
            font-size: 0.95rem;
        }
        .form-control:focus {
            border-color: #10b981;
            box-shadow: 0 0 0 0.2rem rgba(16, 185, 129, 0.18);
        }
        .consent-box {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 0.85rem;
            padding: 0.85rem 1rem;
        }
        .form-check-input:checked {
            background-color: #059669;
            border-color: #059669;
        }
        .btn-emerald {
            background-color: #059669;
            border-color: #059669;
            color: #ffffff;
            font-weight: 600;
            border-radius: 0.7rem;
            padding: 0.7rem 1rem;
            transition: background-color 0.15s ease, transform 0.1s ease;
        }
        .btn-emerald:hover {
            background-color: #047857;
            border-color: #047857;
            color: #ffffff;
        }
        .btn-emerald:active {
            transform: scale(0.99);
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center p-3">

<div class="card oidc-card bg-white">
    <div class="oidc-header">
        <div class="brand-badge">
            <i class="bi bi-shield-lock-fill"></i>
        </div>
        <h5 class="fw-bold mb-1">Criar conta</h5>
        <p class="small mb-0 opacity-90">Cadastre-se uma vez e use em todas as aplicações</p>
    </div>

    <div class="card-body p-4 p-md-4">
        <div th:if="${erroCadastro}" class="alert alert-danger d-flex align-items-center gap-2 rounded-3 py-2 px-3 small" role="alert">
            <i class="bi bi-exclamation-triangle-fill flex-shrink-0"></i>
            <span th:text="${erroCadastro}"></span>
        </div>
        <div th:if="${sucesso}" class="alert alert-success rounded-3 py-2 px-3 small" role="alert">
            <i class="bi bi-check-circle-fill me-1"></i> Conta criada com sucesso!
            Volte para a aplicação e clique em <strong>Entrar</strong>.
            <div class="mt-2"><a class="fw-semibold" th:href="${appLoginUrl}">Ir para a aplicação</a></div>
        </div>

        <form th:unless="${sucesso}" th:action="@{/register}" method="post" autocomplete="off">
            <div class="mb-3">
                <label class="form-label" for="username">Usuário (3–32: letras minúsculas, números, . _ -)</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-secondary rounded-start-3"><i class="bi bi-person"></i></span>
                    <input type="text" id="username" name="username" class="form-control border-start-0 ps-1" th:value="${form_username}" required maxlength="32" pattern="[a-z0-9._-]{3,32}" autofocus>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="name">Nome completo</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-secondary rounded-start-3"><i class="bi bi-card-text"></i></span>
                    <input type="text" id="name" name="name" class="form-control border-start-0 ps-1" th:value="${form_name}" required maxlength="120">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="email">E-mail</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-secondary rounded-start-3"><i class="bi bi-envelope"></i></span>
                    <input type="email" id="email" name="email" class="form-control border-start-0 ps-1" th:value="${form_email}" required maxlength="254">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">Senha (mínimo 10 caracteres)</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-secondary rounded-start-3"><i class="bi bi-key"></i></span>
                    <input type="password" id="password" name="password" class="form-control border-start-0 ps-1" th:value="${null}" required minlength="10" maxlength="72" autocomplete="new-password">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="confirm">Confirmar senha</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-secondary rounded-start-3"><i class="bi bi-key-fill"></i></span>
                    <input type="password" id="confirm" name="confirm" class="form-control border-start-0 ps-1" th:value="${null}" required minlength="10" maxlength="72" autocomplete="new-password">
                </div>
            </div>

            <button type="submit" class="btn btn-emerald w-100">
                <i class="bi bi-person-plus me-1"></i> Criar conta
            </button>
        </form>

        <div class="text-center mt-3">
            <span class="text-muted" style="font-size: 0.75rem;">
                <i class="bi bi-lock-fill text-success me-1"></i>Sua senha fica guardada apenas neste servidor (bcrypt)
            </span>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
