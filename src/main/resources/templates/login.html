<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autorização OIDC | ONG Adoção</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background: radial-gradient(circle at top, #ecfdf5 0%, #f1f5f9 55%, #e2e8f0 100%);
            color: #1e293b;
            min-height: 100vh;
        }
        .oidc-card {
            max-width: 440px;
            width: 100%;
            border: 1px solid #e2e8f0;
            border-radius: 1.25rem;
            box-shadow: 0 20px 35px -12px rgba(15, 23, 42, 0.1);
            overflow: hidden;
        }
        .oidc-header {
            background: linear-gradient(135deg, #065f46 0%, #059669 65%, #10b981 100%);
            color: #ffffff;
            padding: 1.75rem 1.5rem;
            text-align: center;
        }
        .brand-badge {
            width: 52px;
            height: 52px;
            border-radius: 0.9rem;
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(6px);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 0.75rem;
        }
        .form-label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #334155;
        }
        .form-control {
            border-radius: 0.65rem;
            border-color: #cbd5e1;
            padding: 0.625rem 0.875rem;
            font-size: 0.95rem;
        }
        .form-control:focus {
            border-color: #10b981;
            box-shadow: 0 0 0 0.2rem rgba(16, 185, 129, 0.18);
        }
        .consent-box {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 0.85rem;
            padding: 0.85rem 1rem;
        }
        .form-check-input:checked {
            background-color: #059669;
            border-color: #059669;
        }
        .btn-emerald {
            background-color: #059669;
            border-color: #059669;
            color: #ffffff;
            font-weight: 600;
            border-radius: 0.7rem;
            padding: 0.7rem 1rem;
            transition: background-color 0.15s ease, transform 0.1s ease;
        }
        .btn-emerald:hover {
            background-color: #047857;
            border-color: #047857;
            color: #ffffff;
        }
        .btn-emerald:active {
            transform: scale(0.99);
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center p-3">

<div class="card oidc-card bg-white">
    <div class="oidc-header">
        <div class="brand-badge">
            <i class="bi bi-shield-lock-fill"></i>
        </div>
        <h5 class="fw-bold mb-1">Servidor de Autorização</h5>
        <p class="small mb-0 opacity-90">OpenID Connect Provider • Autenticação Segura</p>
    </div>

    <div class="card-body p-4 p-md-4">
        <div th:if="${erroLogin}" class="alert alert-danger d-flex align-items-center gap-2 rounded-3 py-2 px-3 small" role="alert">
            <i class="bi bi-exclamation-triangle-fill flex-shrink-0"></i>
            <span th:text="${erroLogin}"></span>
        </div>

        <form th:action="@{/authorize}" method="post">
            <input type="hidden" name="client_id" th:value="${client_id}">
            <input type="hidden" name="redirect_uri" th:value="${redirect_uri}">
            <input type="hidden" name="scope" th:value="${scope}">
            <input type="hidden" name="state" th:value="${state}">
            <input type="hidden" name="nonce" th:value="${nonce}">
            <input type="hidden" name="code_challenge" th:value="${code_challenge}">

            <div class="mb-3">
                <label class="form-label" for="username">Usuário</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-secondary rounded-start-3">
                        <i class="bi bi-person"></i>
                    </span>
                    <input type="text" id="username" name="username"
                           class="form-control border-start-0 ps-1"
                           placeholder="Digite seu usuário" required autofocus>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="password">Senha</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-secondary rounded-start-3">
                        <i class="bi bi-key"></i>
                    </span>
                    <input type="password" id="password" name="password"
                           class="form-control border-start-0 ps-1"
                           placeholder="Digite sua senha" required>
                </div>
            </div>

            <div class="consent-box mb-4">
                <div class="form-check m-0">
                    <input class="form-check-input" type="checkbox" name="consent" value="true" id="consentCheck" checked required>
                    <label class="form-check-label small text-secondary lh-sm" for="consentCheck">
                        Autorizo compartilhar os dados do escopo
                        <span class="badge bg-success-subtle text-success border border-success-subtle rounded-pill px-2"
                              th:text="${scope}">openid profile email</span>
                        com <strong class="text-dark" th:text="${client_id}">cliente-oidc</strong>.
                    </label>
                </div>
            </div>

            <button type="submit" class="btn btn-emerald w-100">
                <i class="bi bi-check2-shield me-1"></i> Autenticar e Autorizar
            </button>
        </form>

        <div class="text-center mt-3 small">
            Não tem conta? <a th:href="@{/register}" class="fw-semibold text-success">Criar conta</a>
        </div>

        <div class="text-center mt-3">
            <span class="text-muted" style="font-size: 0.75rem;">
                <i class="bi bi-lock-fill text-success me-1"></i>Fluxo Authorization Code com PKCE (S256)
            </span>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
